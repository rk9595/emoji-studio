<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emoji Lab</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#222927;background:#fafbf9;font-size:14px;letter-spacing:0;--line:#dce2dd;--green:#176749;--muted:#637269}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select{cursor:pointer}button{background:white;border:1px solid var(--line);border-radius:5px;padding:8px 12px;color:inherit}button:hover{border-color:var(--green)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #77b89b;outline-offset:2px}button[aria-pressed=true]{background:var(--green);color:white;border-color:var(--green)}header{padding:22px 32px 0;background:white;border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:24px;margin:0;font-weight:750}h1 span{color:var(--green)}.tag{color:#985131;background:#fff1e9;padding:5px 9px;border-radius:4px;font-size:12px}nav{display:flex;gap:24px;margin-top:24px}nav button{border:0;border-radius:0;padding:12px 0;border-bottom:3px solid transparent;background:transparent;color:var(--muted)}nav button[aria-selected=true]{border-color:var(--green);color:var(--green);font-weight:650}main{max-width:1450px;margin:auto;padding:28px 32px}h2{font-size:19px;margin:0 0 6px}.subtle{color:var(--muted);font-size:13px;margin:0;line-height:1.5}.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}.stats{display:flex;gap:24px;flex-wrap:wrap;padding:15px 0 22px;border-bottom:1px solid var(--line);margin-bottom:20px}.stat strong{display:block;font-size:23px}.stat span{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}input[type=search]{min-width:180px;flex:1;padding:10px 12px;background:white;border:1px solid var(--line);border-radius:5px}select{max-width:100%;padding:9px;background:white;border:1px solid var(--line);border-radius:5px}.sizes{display:flex;gap:3px}.sizes button{width:46px;padding:8px 0}.check{display:flex;align-items:center;gap:6px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.asset{min-width:0;border:1px solid var(--line);border-radius:6px;background:white;overflow:hidden}.preview{height:168px;width:100%;border:0;border-radius:0;display:flex;align-items:center;justify-content:center;background-color:#f1f4f0;background-image:repeating-conic-gradient(#e8ede8 0% 25%,transparent 0% 50%);background-size:16px 16px}.dark .preview{background-color:#353d39;background-image:repeating-conic-gradient(#303632 0% 25%,transparent 0% 50%)}.preview img{width:var(--size,64px);height:var(--size,64px);object-fit:contain}.asset-body{padding:12px}.asset-title{font-size:13px;line-height:1.4;font-weight:650;margin:0 0 4px;overflow-wrap:anywhere;min-height:36px}.asset select{font-size:12px;padding:5px;width:100%;margin-top:10px}.caption{font-size:11px;color:var(--muted)}.empty{padding:54px 0;border-top:1px solid var(--line);color:var(--muted)}.benchmark-row{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(180px,0.7fr);gap:20px;border-top:1px solid var(--line);padding:20px 0}.number{font-size:13px;color:var(--muted)}h3{font-size:15px;line-height:1.5;margin:0 0 8px}.eyebrow{color:var(--green);font-size:11px;text-transform:uppercase;margin-bottom:6px}ul{padding-left:18px;margin:0;color:var(--muted);font-size:13px;line-height:1.7}.ref-strip{display:flex;gap:6px;margin-top:12px}.ref-strip img{width:32px;height:32px;object-fit:contain}.run{padding:20px 0;border-top:1px solid var(--line)}.run .grid{margin-top:16px}.run-details{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.run-details p{margin:0}dialog{border:1px solid var(--line);border-radius:8px;width:min(700px,calc(100% - 32px));padding:24px;max-height:90vh;overflow:auto}dialog::backdrop{background:#18282088}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.detail{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;margin-top:20px}.detail-image{width:220px;height:220px;object-fit:contain;background:#edf1ec;border-radius:4px}dl{margin:0;font-size:13px}dt{color:var(--muted);margin-top:12px}dd{margin:3px 0;overflow-wrap:anywhere}a{color:var(--green)}footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}#notice{color:#985131;font-size:13px;min-height:18px;margin-bottom:12px}[hidden]{display:none!important}
@media(max-width:600px){header{padding:18px 16px 0}main{padding:22px 16px}nav{gap:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.preview{height:152px}.toolbar{gap:10px}input[type=search]{flex-basis:100%}.benchmark-row{grid-template-columns:28px minmax(0,1fr);gap:10px}.benchmark-row ul{grid-column:2}.detail{grid-template-columns:1fr}.detail-image{justify-self:center}.stats{gap:20px}.stat strong{font-size:21px}}
</style>
</head>
<body>
<header><div class="top"><h1>Emoji <span>Lab</span></h1><span class="tag">Development workspace</span></div><nav role="tablist" aria-label="Workspace views"><button role="tab" id="tab-references" aria-controls="references" aria-selected="true">References</button><button role="tab" id="tab-benchmark" aria-controls="benchmark" aria-selected="false">Benchmark</button><button role="tab" id="tab-runs" aria-controls="runs" aria-selected="false">Model runs</button></nav></header>
<main><div id="notice" role="status"></div>
<section id="references" role="tabpanel" aria-labelledby="tab-references"><div class="section-head"><div><h2>Reference collection</h2><p class="subtle">Microsoft Fluent Emoji / 3D / MIT licensed</p></div><button id="export">Export reviews</button></div><div id="stats" class="stats"></div><div class="toolbar"><input id="search" type="search" aria-label="Search reference assets" placeholder="Search references"><select id="group" aria-label="Asset group"><option value="">All groups</option></select><div class="sizes" role="group" aria-label="Preview size"><button data-size="32" aria-pressed="false">32</button><button data-size="64" aria-pressed="true">64</button><button data-size="128" aria-pressed="false">128</button></div><label class="check"><input id="dark" type="checkbox">Dark preview</label></div><p id="count" class="subtle" style="margin-bottom:12px" aria-live="polite"></p><div id="asset-grid" class="grid"></div></section>
<section id="benchmark" role="tabpanel" aria-labelledby="tab-benchmark" hidden><div class="section-head"><div><h2>Development benchmark</h2><p class="subtle">40 concepts / 4 families / explicit acceptance criteria</p></div><select id="category" aria-label="Prompt category"><option value="">All families</option></select></div><div id="prompt-list"></div></section>
<section id="runs" role="tabpanel" aria-labelledby="tab-runs" hidden><div class="section-head"><div><h2>Model runs</h2><p class="subtle" id="run-summary"></p></div><div class="sizes" role="group" aria-label="Output preview size"><button data-size="32" aria-pressed="false">32</button><button data-size="64" aria-pressed="true">64</button><button data-size="128" aria-pressed="false">128</button></div></div><div id="run-list"></div></section>
<footer><span>Reference artwork is not model output.</span><a id="license-link" hidden>Source license</a><span id="review-status"></span></footer>
</main>
<dialog id="detail"><div class="dialog-head"><h2 id="detail-title"></h2><button id="close-detail">Close</button></div><div id="detail-body" class="detail"></div></dialog>
<script id="dataset" type="application/json">__WORKBENCH_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.querySelector('#dataset').textContent);
const $=s=>document.querySelector(s);
const make=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
const storeKey='emoji-lab-reviews-v1';let reviews={};
try{reviews=JSON.parse(localStorage.getItem(storeKey)||'{}');if(!reviews||Array.isArray(reviews)||typeof reviews!=='object')reviews={}}catch{$('#notice').textContent='Browser storage unavailable. Export reviews before closing.'}
function saveReview(key,value){reviews[key]={value,updated_at:new Date().toISOString()};try{localStorage.setItem(storeKey,JSON.stringify(reviews))}catch{$('#notice').textContent='Reviews are not saved in this browser. Export before closing.'}reviewCount()}
function reviewCount(){$('#review-status').textContent=Object.keys(reviews).length+' review decisions in this browser'}
function picker(key,options,label){const s=make('select');s.setAttribute('aria-label',label);for(const [value,text] of options){const o=make('option','',text);o.value=value;s.append(o)}s.value=reviews[key]?.value||'';s.onchange=()=>saveReview(key,s.value);return s}
function pilotReview(row){return data.curation?.rows.find(r=>r.asset_id===row.id&&r.sha256===row.sha256)}
function detail(row){$('#detail-title').textContent=row.concept;const body=$('#detail-body');body.replaceChildren();const img=make('img','detail-image');img.src=row.path;img.alt=row.concept;body.append(img);const dl=make('dl'),review=pilotReview(row),selected=review?.decision==='keep';for(const [label,value] of [['Source','Microsoft Fluent Emoji'],['Native size',row.width+' x '+row.height],['Tone',row.tone],[selected?'AI-reviewed caption':'Draft caption',selected?review.caption:row.caption],['Pilot assignment',selected?review.split:review?.decision==='exclude'?'Outside current pilot':'Unreviewed / no split assigned'],['Review',selected?review.reviewer:'No visual review recorded'],['Training','Not started'],['Revision',row.source_revision]]){dl.append(make('dt','',label),make('dd','',value))}const a=make('a','','Original source');a.href=row.source_url;a.target='_blank';a.rel='noopener';dl.append(make('dt','','Provenance'),a);body.append(dl);$('#detail').showModal()}
function references(){const query=$('#search').value.toLowerCase(),group=$('#group').value;const rows=data.references.filter(r=>(!group||r.group===group)&&(r.concept+' '+r.keywords.join(' ')).toLowerCase().includes(query));$('#count').textContent=rows.length+' of '+data.references.length+' references';const grid=$('#asset-grid');grid.replaceChildren();for(const row of rows){const card=make('article','asset'),preview=make('button','preview');preview.setAttribute('aria-label','Inspect '+row.concept);preview.onclick=()=>detail(row);const img=make('img');img.src=row.path;img.alt=row.concept;img.loading='lazy';preview.append(img);const body=make('div','asset-body');body.append(make('h3','asset-title',row.concept),make('span','caption',row.width+' px source / '+row.tone));body.append(picker('reference:'+row.id+':'+row.sha256,[['','Unreviewed'],['keep','Keep for curation'],['exclude','Exclude']],'Review '+row.concept));card.append(preview,body);grid.append(card)}if(!rows.length)grid.append(make('p','empty','No matching references.'))}
function benchmark(){const list=$('#prompt-list');list.replaceChildren();const category=$('#category').value;for(const [i,row] of data.benchmark.prompts.entries()){if(category&&row.category!==category)continue;const article=make('article','benchmark-row');article.append(make('span','number',String(i+1).padStart(2,'0')));const text=make('div');text.append(make('div','eyebrow',row.category+' / '+row.mode),make('h3','',row.prompt));const strip=make('div','ref-strip');for(const name of row.references||[]){const ref=data.references.find(r=>r.concept.toLowerCase()===name.toLowerCase());if(ref){const img=make('img');img.src=ref.path;img.alt=name;img.title='Reference: '+name;strip.append(img)}}text.append(strip);const criteria=make('ul');row.criteria.forEach(c=>criteria.append(make('li','',c)));article.append(text,criteria);list.append(article)}}
function outputDetail(row,run){
  $('#detail-title').textContent=run.model+' / '+row.job.prompt_id;
  const body=$('#detail-body');body.replaceChildren();
  const img=make('img','detail-image');img.src=row.image;img.alt=row.job.source_prompt;
  const details=make('div');details.append(make('h3','',row.job.source_prompt));
  if(run.review?.valid_for_quality_comparison===false)details.append(make('p','tag','Diagnostic only: '+run.review.reason));
  const criteria=make('ul');row.job.criteria.forEach(c=>criteria.append(make('li','',c)));details.append(criteria);
  const dl=make('dl');for(const [label,value] of [['Sampling',row.job.model.steps+' steps / guidance '+row.job.model.guidance_scale],['Size',row.width+' x '+row.height],['Generation',row.metrics.generation_seconds+' seconds'],['Peak GPU allocation',(row.metrics.peak_allocated_bytes/2**30).toFixed(2)+' GiB'],['Background','Original output / alpha not processed']]){dl.append(make('dt','',label),make('dd','',value))}
  const link=make('a','','Open original PNG');link.href=row.image;link.target='_blank';link.rel='noopener';details.append(dl,make('br'),link);body.append(img,details);$('#detail').showModal();
}
function runs(){
  const list=$('#run-list');let generated=0,planned=0;
  for(const run of data.runs){
    const section=make('section','run');const complete=run.rows.filter(r=>r.status==='completed');generated+=complete.length;planned+=run.rows.length;
    section.append(make('h3','',run.name));const meta=make('div','run-details');meta.append(make('p','subtle',run.model+' / '+complete.length+' of '+run.rows.length+' completed'));section.append(meta);
    if(run.review?.valid_for_quality_comparison===false)section.append(make('p','tag','Diagnostic only: '+run.review.reason));
    if(!complete.length)section.append(make('p','subtle','No generated images'));
    const grid=make('div','grid');
    for(const row of run.rows.filter(r=>r.status!=='planned')){
      const card=make('article','asset');
      if(row.status==='completed'){
        const preview=make('button','preview');preview.setAttribute('aria-label','Inspect '+run.model+' '+row.job.prompt_id);preview.onclick=()=>outputDetail(row,run);
        const img=make('img');img.src=row.image;img.alt=row.job.source_prompt;preview.append(img);card.append(preview);
      }
      const body=make('div','asset-body');body.append(make('h3','asset-title',row.job.source_prompt),make('div','caption',row.job.condition+' / seed '+row.job.seed+' / '+row.status));
      if(row.status==='completed'){
        body.append(make('p','subtle',row.metrics.generation_seconds+' s / '+(row.metrics.peak_allocated_bytes/2**30).toFixed(1)+' GiB peak'));
        if(run.review?.valid_for_quality_comparison!==false)body.append(picker('output:'+run.experiment_hash+':'+row.id,[['','Unreviewed'],['usable','Usable at 32 px'],['revise','Needs revision'],['reject','Reject']],'Review generated '+row.id));
      }
      if(row.error)body.append(make('p','subtle',row.error));card.append(body);grid.append(card);
    }
    section.append(grid);list.append(section);
  }
  $('#run-summary').textContent=generated+' generated / '+planned+' planned samples';if(!data.runs.length)list.append(make('p','empty','No model runs yet.'));
}
const tabs=[...document.querySelectorAll('[role=tab]')];function activate(tab){for(const other of tabs){const selected=other===tab;other.setAttribute('aria-selected',String(selected));other.tabIndex=selected?0:-1;document.getElementById(other.getAttribute('aria-controls')).hidden=!selected}}tabs.forEach((tab,i)=>{tab.tabIndex=i===0?0:-1;tab.onclick=()=>activate(tab);tab.onkeydown=e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();const next=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];activate(next);next.focus()}}});
for(const group of [...new Set(data.references.map(r=>r.group))].sort()){const o=make('option','',group);o.value=group;$('#group').append(o)}
for(const category of [...new Set(data.benchmark.prompts.map(r=>r.category))]){const o=make('option','',category);o.value=category;$('#category').append(o)}
for(const [value,label] of [[data.references.length,'Reference assets'],[data.audit.distinct_concepts||0,'Source concepts'],[data.benchmark.prompts.length,'Benchmark prompts'],[data.curation?.rows.filter(r=>r.decision==='keep').length||0,'Pilot-selected assets']]){const s=make('div','stat');s.append(make('strong','',String(value)),make('span','',label));$('#stats').append(s)}
$('#search').oninput=references;$('#group').onchange=references;$('#category').onchange=benchmark;$('#dark').onchange=e=>document.body.classList.toggle('dark',e.target.checked);
document.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{document.documentElement.style.setProperty('--size',b.dataset.size+'px');document.querySelectorAll('[data-size]').forEach(o=>o.setAttribute('aria-pressed',String(o===b)))});
$('#close-detail').onclick=()=>$('#detail').close();$('#detail').onclick=e=>{if(e.target===$('#detail')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}};
$('#export').onclick=()=>{const payload={schema_version:1,exported_at:new Date().toISOString(),reference_manifest_hash:data.audit.manifest_hash||null,review_decisions:reviews};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=make('a');a.href=url;a.download='emoji-lab-reviews.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
if(data.audit.license_path){$('#license-link').href=data.audit.license_path;$('#license-link').hidden=false}
reviewCount();references();benchmark();runs();
</script>
</body></html>
