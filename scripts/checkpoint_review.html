<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blinded checkpoint review</title>
<style>:root{font-family:system-ui,sans-serif;color:#19221e;background:#f5f7f3;--green:#176749;--line:#d9e1da}*{box-sizing:border-box}body{margin:0}header{padding:22px 5vw;background:#102d21;color:white}header h1{margin:0;font-size:22px}header p{color:#c7ddd2;margin:5px 0 0}main{max-width:1100px;margin:auto;padding:30px 24px}.progress{display:flex;justify-content:space-between;gap:20px;margin-bottom:18px;color:#637269}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px}h2{font-size:17px;margin:0 0 7px}.criteria{color:#637269;font-size:13px;line-height:1.55}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.choice{border:2px solid transparent;border-radius:10px;background:#eef2ed;padding:0;cursor:pointer;overflow:hidden}.choice[aria-pressed=true]{border-color:var(--green);box-shadow:0 0 0 3px #b9decf}.choice img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.choice span{display:block;background:white;padding:10px;font-weight:700}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{font:inherit;border:1px solid var(--line);background:white;padding:9px 13px;border-radius:7px;cursor:pointer}button.primary{background:var(--green);color:white;border-color:var(--green)}label{color:#637269;font-size:13px;display:flex;gap:6px;align-items:center}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}@media(max-width:650px){.pair{grid-template-columns:1fr}.bottom{align-items:stretch;flex-direction:column}}</style></head>
<body><header><h1>Blinded checkpoint review</h1><p>Choose the stronger result for prompt fidelity, emoji style, and 32 px readability.</p></header><main><div class="progress"><span id="position"></span><span id="reviewed"></span></div><section class="card"><h2 id="prompt"></h2><div id="criteria" class="criteria"></div><div class="pair"><button class="choice" id="left" aria-pressed="false"><img alt="Candidate A"><span>Candidate A</span></button><button class="choice" id="right" aria-pressed="false"><img alt="Candidate B"><span>Candidate B</span></button></div><div class="controls"><button id="tie">Tie</button><button id="bad">Both unusable</button><label><input id="left-severe" type="checkbox">A has severe geometry error</label><label><input id="right-severe" type="checkbox">B has severe geometry error</label></div><div class="bottom"><button id="previous">Previous</button><button id="export">Export review JSON</button><button class="primary" id="next">Save and next</button></div></section></main>
<script id="data" type="application/json">__REVIEW_DATA__</script><script>'use strict';const data=JSON.parse(document.querySelector('#data').textContent),$=s=>document.querySelector(s),key='emoji-checkpoint-review-v1:'+data.review_id;let index=0,reviews={};try{reviews=JSON.parse(localStorage.getItem(key)||'{}')}catch{}let selection='';function show(){const row=data.comparisons[index],saved=reviews[row.id]||{};selection=saved.preference||'';$('#prompt').textContent=row.prompt;$('#criteria').textContent=row.criteria.join(' · ');$('#left img').src=row.left_image;$('#right img').src=row.right_image;$('#left').setAttribute('aria-pressed',selection==='left');$('#right').setAttribute('aria-pressed',selection==='right');$('#left-severe').checked=!!saved.left_severe;$('#right-severe').checked=!!saved.right_severe;$('#position').textContent=`Comparison ${index+1} of ${data.comparisons.length}`;$('#reviewed').textContent=`${Object.keys(reviews).length} saved`;$('#previous').disabled=index===0}function choose(value){selection=value;$('#left').setAttribute('aria-pressed',value==='left');$('#right').setAttribute('aria-pressed',value==='right')}function save(){if(!selection){alert('Choose A, B, tie, or both unusable.');return false}const row=data.comparisons[index];reviews[row.id]={preference:selection,left_severe:$('#left-severe').checked,right_severe:$('#right-severe').checked,updated_at:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(reviews));return true}$('#left').onclick=()=>choose('left');$('#right').onclick=()=>choose('right');$('#tie').onclick=()=>choose('tie');$('#bad').onclick=()=>choose('both_bad');$('#next').onclick=()=>{if(save()&&index<data.comparisons.length-1){index++;show()}};$('#previous').onclick=()=>{if(index>0){index--;show()}};$('#export').onclick=()=>{if(selection)save();const payload={schema_version:1,review_id:data.review_id,exported_at:new Date().toISOString(),reviews};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='checkpoint-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};show();</script></body></html>
