[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "emoji-studio"
version = "0.2.0"
description = "Reproducible emoji post-training, evaluation, and queued generation service"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "pillow>=11.3,<13",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
serverless = ["vastai==1.8.0"]
gpu = [
  "torch==2.10.0",
  "diffusers==0.40.0",
  "peft>=0.17,<1",
  "transformers==5.17.0",
  "accelerate>=1.10,<2",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
]

[project.scripts]
emoji-studio = "emoji_studio.cli:main"
emoji-studio-api = "emoji_studio.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/emoji_studio", "deployment"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "ruff>=0.12,<1"]
browser = ["playwright>=1.55,<2"]
training-data = ["datasets>=4,<6"]
training = [
  {include-group = "training-data"},
  "torchvision==0.25.0",
  "tensorboard>=2.20,<3",
  "ftfy>=6.3,<7",
  "jinja2>=3.1,<4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
