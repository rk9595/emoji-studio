name: AMD coverage training
on: workflow_dispatch
permissions:
  contents: write
concurrency:
  group: amd-coverage-20261031a
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  AMD_DEV_CLOUD_TOKEN: ${{ secrets.AMD_DEV_CLOUD_TOKEN }}
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Register independent expiry and verify cleanup
        run: python3 ops/amd_training_live.py watchdog
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      AMD_TRAINING_SOURCE: ${{ vars.AMD_TRAINING_SOURCE }}
      AMD_SSH_KEY_ID: ${{ vars.AMD_SSH_KEY_ID }}
      AMD_SSH_KEY_FILE: /tmp/emoji-training-key
    steps:
      - uses: actions/checkout@v4
      - name: Install dedicated SSH key
        env:
          SSH_KEY: ${{ secrets.AMD_SSH_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SSH_KEY" > "$AMD_SSH_KEY_FILE"
      - name: Allocate once, validate training, retain results and delete GPU
        run: python3 ops/amd_training_live.py run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: amd-training-evidence-${{ github.run_id }}
          path: |
            training-state.json
            allocation-intent.json
            training-preflight.json
            training-results/
            worker.log
            transport-errors.jsonl
          retention-days: 14
