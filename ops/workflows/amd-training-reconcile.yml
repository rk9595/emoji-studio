name: AMD training cleanup reconciliation
on: workflow_dispatch
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      AMD_DEV_CLOUD_TOKEN: ${{ secrets.AMD_DEV_CLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 ops/amd_training_reconcile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: training-cleanup-reconciliation
          path: independent-cleanup-reconciliation.json
          retention-days: 14
